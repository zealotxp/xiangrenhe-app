<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>我的团队 · 湘仁禾私域会员APP</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="phone">
  <div class="statusbar" data-statusbar></div>
  <div class="nav" data-nav data-back="promotion.html" data-title="我的团队" data-sub="推广员 王姐 · 一级直推"></div>

  <div class="page">
    <div class="stats" style="margin-bottom:12px">
      <div class="stat"><b>38</b><span>直属顾客</span></div>
      <div class="stat"><b>30</b><span>本月达标看播</span></div>
      <div class="stat"><b>26</b><span>已扫码购产品</span></div>
    </div>

    <div class="card tight">
      <input class="inp" id="kw" placeholder="搜索顾客昵称 / 手机号" style="width:100%;border:1px solid var(--line);border-radius:12px;background:#FBFCFB;padding:10px 12px;font-size:13.5px">
    </div>

    <div class="sec"><h2>顾客列表</h2><span class="more">归属：王姐 › 仁和堂·雨花店</span></div>
    <div class="list" id="team">
      <div class="li" data-n="张叔"><div class="avatar sm">张</div><div class="li-body"><div class="li-t">张叔</div><div class="li-s">138****2231</div></div><span class="li-x">›</span></div>
      <div class="li" data-n="陈阿姨"><div class="avatar sm">陈</div><div class="li-body"><div class="li-t">陈阿姨</div><div class="li-s">139****7788</div></div><span class="li-x">›</span></div>
      <div class="li" data-n="黄老师"><div class="avatar sm">黄</div><div class="li-body"><div class="li-t">黄老师</div><div class="li-s">137****0092</div></div><span class="li-x">›</span></div>
      <div class="li" data-n="刘伯伯"><div class="avatar sm">刘</div><div class="li-body"><div class="li-t">刘伯伯</div><div class="li-s">135****4410</div></div><span class="li-x">›</span></div>
      <div class="li" data-n="周阿姨"><div class="avatar sm">周</div><div class="li-body"><div class="li-t">周阿姨</div><div class="li-s">186****3320</div></div><span class="li-x">›</span></div>
      <div class="li" data-n="吴奶奶"><div class="avatar sm">吴</div><div class="li-body"><div class="li-t">吴奶奶</div><div class="li-s">158****6677</div></div><span class="li-x">›</span></div>
    </div>

    <div class="tip">
      <span>ⓘ</span>
      <div>归属关系在注册时一次性绑定，<b>后续不可随意变更</b>；同一顾客仅归属一个推广员，避免重复归属。</div>
    </div>

    <a class="btn btn-block btn-gold" href="invite.html">邀请新顾客（我的注册链接）</a>
  </div>
</div>

<script src="assets/app.js"></script>
<script>
var rows = document.querySelectorAll('#team .li');
for (var i = 0; i < rows.length; i++) {
  rows[i].addEventListener('click', function () {
    var n = this.getAttribute('data-n');
    XRH.modal({
      html:
        '<div class="modal-hero"><div class="mi">' + n.charAt(0) + '</div>' +
        '<div class="mt">' + n + '</div>' +
        '<div class="ms">归属：王姐 › 仁和堂健康生活馆（长沙雨花店）</div></div>' +
        '<div class="modal-body"><div class="mk">本月行为</div>' +
        '<ul><li>看播：6 场，累计 128 分钟</li><li>签到：11 / 12 次</li><li>扫码购产品：6 盒，累计 2,388 积分</li><li>红包领取：¥12.00</li></ul>' +
        '<div class="mk" style="margin-top:10px">可操作</div>' +
        '<ul><li>查看 TA 的看播明细</li><li>发送开播提醒</li><li>联系 TA（APP 内消息）</li></ul></div>' +
        '<div class="modal-foot"><button class="btn" data-close>关闭</button><button class="btn btn-primary" data-close>发送开播提醒</button></div>'
    });
  });
}
document.getElementById('kw').oninput = function () {
  var v = this.value.trim();
  for (var j = 0; j < rows.length; j++) {
    var n = rows[j].getAttribute('data-n');
    rows[j].classList.toggle('hide', !!v && n.indexOf(v) < 0);
  }
};
</script>
</body>
</html>
